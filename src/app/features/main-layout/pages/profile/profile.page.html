<div class="flex flex-col gap-4 pb-8 sm:gap-5 lg:gap-6">
  <!-- Header -->
  <div class="flex flex-col gap-1 sm:gap-1.5">
    <h1 class="font-heading text-xl font-bold text-ink sm:text-2xl lg:text-[26px]">個人中心</h1>
    <p class="text-sm text-text-secondary">帳號資訊、第三方綁定與你的學習紀錄</p>
  </div>

  @if (store.loading()) {
    <div class="flex items-center justify-center py-20 text-text-muted">
      <i class="fa-solid fa-spinner fa-spin mr-2"></i> 載入中...
    </div>
  } @else {
    <div class="flex flex-col gap-4 sm:gap-5 lg:grid lg:grid-cols-[380px_1fr] lg:items-start lg:gap-6">
      <!-- 左欄 -->
      <div class="flex flex-col gap-4 sm:gap-5 lg:gap-6">
        <app-profile-account-card />
        <app-profile-goal-card />
        <app-profile-bindings-card />
      </div>

      <!-- 右欄 -->
      <div class="flex flex-col gap-4 sm:gap-5 lg:gap-6">
        <app-profile-study-plan-card />
        <app-profile-vocab-stats-card />
        <app-profile-exam-history-card />
      </div>
    </div>
  }
</div>
