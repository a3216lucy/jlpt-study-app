<div class="flex flex-col gap-3 rounded-lg border border-border bg-surface p-4 sm:p-5">
  <p class="font-heading text-base font-bold text-ink sm:text-[17px]">綁定的登入方式</p>

  <div class="flex items-center justify-between gap-2 rounded-md bg-bg px-3.5 py-2.5">
    <span class="flex items-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-full bg-surface ring-1 ring-border">
        <svg class="h-4 w-4" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
          />
        </svg>
      </span>
      <span class="flex flex-col">
        <span class="text-sm font-bold text-ink">Google</span>
        <span class="text-xs text-text-muted">{{ store.currentUser()?.email }}</span>
      </span>
    </span>
    <span class="rounded-full bg-matcha-soft px-2.5 py-1 text-[11px] font-bold text-matcha"> 已綁定 </span>
  </div>

  <div class="flex items-center justify-between gap-2 rounded-md bg-bg px-3.5 py-2.5">
    <span class="flex items-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-full bg-surface ring-1 ring-border">
        <i class="fa-regular fa-comment text-sm text-matcha"></i>
      </span>
      <span class="flex flex-col">
        <span class="text-sm font-bold text-ink">LINE</span>
        <span class="text-xs text-text-muted">尚未綁定</span>
      </span>
    </span>
    <button
      type="button"
      (click)="bindComingSoon('LINE')"
      class="rounded-full border border-border bg-surface px-3.5 py-1.5 text-xs font-bold text-text-secondary transition hover:border-accent/40 hover:text-accent"
    >
      綁定
    </button>
  </div>

  <div class="flex items-center justify-between gap-2 rounded-md bg-bg px-3.5 py-2.5">
    <span class="flex items-center gap-2.5">
      <span class="flex h-8 w-8 items-center justify-center rounded-full bg-surface ring-1 ring-border">
        <i class="fa-brands fa-apple text-sm text-ink"></i>
      </span>
      <span class="flex flex-col">
        <span class="text-sm font-bold text-ink">Apple</span>
        <span class="text-xs text-text-muted">尚未綁定</span>
      </span>
    </span>
    <button
      type="button"
      (click)="bindComingSoon('Apple')"
      class="rounded-full border border-border bg-surface px-3.5 py-1.5 text-xs font-bold text-text-secondary transition hover:border-accent/40 hover:text-accent"
    >
      綁定
    </button>
  </div>

  @if (bindMessage()) {
    <p class="text-xs text-accent">{{ bindMessage() }}</p>
  }

  <p class="text-xs text-text-muted">綁定多個帳號後，任一方式皆可登入並同步學習進度</p>
</div>
