<div class="flex flex-col gap-3 rounded-lg border border-border bg-surface p-4 sm:p-5">
  <div class="flex items-center justify-between">
    <p class="font-heading text-base font-bold text-ink sm:text-[17px]">應試目標</p>
    @if (!store.editingGoal()) {
      <button type="button" (click)="store.startEditGoal()" class="flex items-center gap-1 text-xs font-bold text-accent">
        <i class="fa-solid fa-pen text-[10px]"></i> 編輯
      </button>
    }
  </div>

  @if (!store.editingGoal()) {
    <div class="flex flex-wrap items-center gap-2">
      @for (lv of levelOptions; track lv) {
        <span
          [class]="
            'rounded-full px-4 py-1.5 text-sm font-bold ' +
            (lv === store.targetLevel()
              ? 'bg-accent text-white'
              : 'border border-border bg-bg text-text-secondary')
          "
        >
          {{ lv }}
        </span>
      }
    </div>

    <div class="flex items-center justify-between gap-2 rounded-md bg-bg px-3.5 py-2.5">
      <span class="flex items-center gap-1.5 text-[13px] font-bold text-ink">
        <i class="fa-regular fa-calendar text-text-muted"></i>
        考試日期 {{ formatDateStr(store.examDate()) }}
      </span>
      <span class="text-[13px] font-bold text-accent"> 倒數 {{ store.daysUntilGoalExam() }} 天 </span>
    </div>

    <p class="text-xs text-text-muted">首頁倒數與考古題預設級別會依此目標顯示</p>
  } @else {
    <div class="flex flex-wrap items-center gap-2">
      @for (lv of levelOptions; track lv) {
        <button
          type="button"
          (click)="store.setDraftLevel(lv)"
          [class]="
            'rounded-full px-4 py-1.5 text-sm font-bold transition ' +
            (lv === store.draftLevel()
              ? 'bg-accent text-white'
              : 'border border-border bg-bg text-text-secondary hover:border-accent/40')
          "
        >
          {{ lv }}
        </button>
      }
    </div>

    <input
      type="date"
      [value]="store.draftExamDate()"
      (change)="onExamDateChange($event)"
      class="rounded-md border border-border bg-bg px-3.5 py-2.5 text-sm text-ink"
    />

    <div class="flex gap-2">
      <button
        type="button"
        (click)="store.cancelEditGoal()"
        [disabled]="store.savingGoal()"
        class="flex-1 rounded-full border border-border bg-surface py-2.5 text-sm font-bold text-text-secondary transition hover:bg-bg disabled:opacity-50"
      >
        取消
      </button>
      <button
        type="button"
        (click)="store.saveGoal()"
        [disabled]="store.savingGoal()"
        class="flex flex-1 items-center justify-center gap-2 rounded-full bg-accent py-2.5 text-sm font-bold text-white transition hover:brightness-105 disabled:opacity-60"
      >
        @if (store.savingGoal()) {
          <i class="fa-solid fa-spinner fa-spin text-xs"></i> 儲存中...
        } @else {
          <i class="fa-solid fa-check text-xs"></i> 儲存
        }
      </button>
    </div>
  }
</div>
