<div class="flex items-center justify-between gap-3 rounded-lg border border-border bg-surface p-4 sm:p-5">
  <div class="flex items-center gap-3">
    @if (store.currentUser()?.photoURL) {
      <img [src]="store.currentUser()!.photoURL!" alt="avatar" class="h-12 w-12 rounded-full ring-1 ring-border" />
    } @else {
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-sakura font-heading text-lg font-bold text-white">
        {{ store.currentUser()?.displayName?.[0] ?? '?' }}
      </div>
    }
    <div class="flex flex-col">
      <p class="font-heading text-base font-bold text-ink">
        {{ store.currentUser()?.displayName ?? '使用者' }}
      </p>
      <p class="text-xs text-text-secondary">{{ store.currentUser()?.email }}</p>
    </div>
  </div>
  <button
    type="button"
    (click)="logout()"
    class="flex shrink-0 items-center gap-1.5 rounded-full border border-border bg-surface px-4 py-2 text-sm font-bold text-text-secondary transition hover:border-accent/40 hover:text-accent"
  >
    <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i> 登出
  </button>
</div>
