<div
  [class]="
    'flex flex-col gap-1 rounded-lg border border-border bg-surface p-3 transition sm:w-64 sm:shrink-0 ' +
    (store.isSearching() ? 'opacity-50' : '')
  "
>
  <p class="px-2 py-1 text-xs font-bold text-text-muted">句型分類</p>
  <div class="flex gap-1.5 overflow-x-auto pb-1 sm:flex-col sm:overflow-visible sm:pb-0">
    @for (group of store.displayGroups(); track group.id) {
      <button
        type="button"
        (click)="store.selectGroup(group.id)"
        [disabled]="store.isSearching()"
        [class]="
          'flex shrink-0 items-center justify-between gap-3 rounded-md px-3 py-2 text-left text-sm transition sm:shrink ' +
          (store.selectedGroup()?.id === group.id && !store.isSearching()
            ? 'bg-accent-soft font-bold text-accent'
            : 'text-text-secondary hover:bg-bg')
        "
      >
        <span class="flex items-center gap-2 whitespace-nowrap">
          <span [class]="'h-2 w-2 shrink-0 rounded-full ' + dotClass(group.color)"></span>
          {{ group.title }}
        </span>
        <span class="text-xs text-text-muted">{{ group.patterns.length }}</span>
      </button>
    }
  </div>
  <div class="mt-1 flex items-center gap-1.5 rounded-md bg-bg px-3 py-2 text-xs font-bold text-accent">
    <i class="fa-solid fa-bookmark"></i> 已收藏句型 {{ store.bookmarkedCount() }} 個
  </div>
</div>
