<div class="flex flex-col gap-4 pb-8 sm:gap-5 lg:gap-6">
  <!-- Header（手機搜尋展開時，整列換成搜尋框） -->
  <div [class]="'flex items-center justify-between gap-3 ' + (searchOpen() ? 'hidden sm:flex' : '')">
    <h1 class="font-heading text-xl font-bold text-ink sm:text-2xl lg:text-[26px]">句型</h1>
    <div class="flex items-center gap-1.5">
      <button
        type="button"
        (click)="openSearch(searchInput)"
        aria-label="搜尋"
        [class]="
          'flex h-8 w-8 items-center justify-center rounded-full border text-sm transition sm:hidden ' +
          (store.isSearching() ? 'border-border bg-accent-soft text-accent' : 'border-border bg-bg text-accent')
        "
      >
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      @for (level of levels; track level) {
        <button
          type="button"
          (click)="store.selectLevel(level)"
          [class]="
            'rounded-full px-3 py-1 text-sm font-bold transition sm:px-4 sm:py-1.5 ' +
            (store.selectedLevel() === level
              ? 'bg-accent text-white'
              : 'border border-border bg-bg text-text-secondary hover:border-accent/40')
          "
        >
          {{ level }}
        </button>
      }
    </div>
  </div>

  <!-- 搜尋框：平板以上一直顯示；手機點放大鏡才展開 -->
  <div [class]="'relative ' + (searchOpen() ? '' : 'hidden sm:block')">
    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-sm text-text-muted"></i>
    <input
      #searchInput
      type="text"
      [value]="store.searchQuery()"
      (input)="store.setSearchQuery($any($event.target).value)"
      placeholder="搜尋句型、意味或接続方式…"
      class="w-full rounded-full border border-border bg-surface py-2.5 pl-10 pr-11 text-sm text-ink placeholder:text-text-muted focus:border-accent/50 focus:outline-none"
    />
    <button
      type="button"
      (click)="closeSearch()"
      aria-label="關閉搜尋"
      class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-text-muted sm:hidden"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- Tabs + count -->
  <div class="flex items-center justify-between gap-2">
    <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-sm text-ink">
      <label class="flex cursor-pointer items-center gap-2">
        <input type="checkbox" [checked]="store.onlyHot()" (change)="store.setOnlyHot($any($event.target).checked)" class="h-4 w-4 accent-[#E0664F]" />
        只看常考
      </label>
      <label class="flex cursor-pointer items-center gap-2">
        <input type="checkbox" [checked]="store.onlyBookmarked()" (change)="store.setOnlyBookmarked($any($event.target).checked)" class="h-4 w-4 accent-[#E0664F]" />
        只看收藏
      </label>
    </div>
    <button type="button" (click)="store.toggleAllOpen()" class="shrink-0 text-sm font-bold text-accent">
      {{ store.allOpen() ? '全部收合' : '全部展開' }}
    </button>
  </div>

  @if (store.loading()) {
    <div class="flex items-center justify-center py-20 text-text-muted">
      <i class="fa-solid fa-spinner fa-spin mr-2"></i> 載入中...
    </div>
  } @else if (!store.hasData()) {
    <div
      class="flex flex-col items-center gap-2 rounded-lg border border-dashed border-accent/40 bg-accent-soft/40 px-6 py-12 text-center"
    >
      <p class="text-sm font-bold text-ink">{{ store.selectedLevel() }} 句型整理準備中</p>
      <p class="text-xs text-text-secondary">目前提供 N3、N2，其他等級陸續新增</p>
    </div>
  } @else {
    <!-- 句型測驗 CTA -->
    <a
      routerLink="/large-quiz"
      class="flex items-center justify-between gap-3 rounded-lg border border-accent/30 bg-accent-soft/60 px-4 py-2.5 transition hover:bg-accent-soft"
    >
      <span class="flex items-center gap-2 text-sm font-bold text-ink">
        <i class="fa-solid fa-pen text-accent"></i> {{ store.selectedLevel() }} 句型測驗
      </span>
      <span class="flex items-center gap-1.5 text-sm font-bold text-accent">開始 <i class="fa-solid fa-arrow-right text-xs"></i></span>
    </a>

    <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:gap-5 lg:gap-6">
      <app-sentence-category-sidebar />
      <app-sentence-pattern-grid />
    </div>
  }
</div>
