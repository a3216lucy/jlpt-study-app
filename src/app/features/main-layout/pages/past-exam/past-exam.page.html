@if (store.phase() === 'overview') {
  <app-past-exam-overview />
}

@if (store.phase() === 'taking') {
  <app-past-exam-taking />
}

@if (store.phase() === 'result') {
  <app-past-exam-result />
}

@if (store.phase() === 'review') {
  <app-past-exam-review />
}

@if (store.phase() === 'notebook') {
  <app-past-exam-notebook />
}

@if (store.startDialogExam()) {
  <app-past-exam-start-dialog />
}
