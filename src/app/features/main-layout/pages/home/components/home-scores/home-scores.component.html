<div class="flex flex-col gap-2.5 rounded-lg border border-border bg-surface p-4 sm:gap-3 sm:p-5 lg:p-6">
  <h2 class="font-heading text-base font-bold text-ink sm:text-[17px]">最近考古題成績</h2>

  @if (store.recentScores().length === 0) {
    <p class="py-6 text-center text-sm text-text-muted">尚無考古題作答紀錄</p>
  } @else {
    @for (entry of store.recentScores(); track entry.id) {
      <div class="flex items-center justify-between rounded-md bg-bg px-3.5 py-2.5 sm:px-4">
        <div class="flex flex-col gap-0.5">
          <span class="text-sm font-bold text-ink">{{ entry.examLabel }} {{ entry.sectionLabel }}</span>
          <span class="text-[11px] text-text-muted">{{ entry.score }}/{{ entry.total }} 題正確</span>
        </div>
        <span class="font-heading text-lg font-bold" [class]="scoreColorClass(scorePercent(entry.score, entry.total))">
          {{ scorePercent(entry.score, entry.total) }}%
        </span>
      </div>
    }
  }
</div>
