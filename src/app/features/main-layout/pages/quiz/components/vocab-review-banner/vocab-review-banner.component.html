@if (visible()) {
  @let c = config();
  <div [class]="'flex flex-col gap-3 rounded-lg border p-4 ' + c.containerClass">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span [class]="'flex h-8 w-8 items-center justify-center rounded-full ' + c.iconCircleClass">
          <i [class]="'fa-solid ' + c.icon + ' text-xs'"></i>
        </span>
        <div class="flex flex-col">
          <span class="text-sm font-bold text-ink">{{ c.title }}</span>
          <span class="text-xs text-text-secondary">{{ c.count }} 個單字</span>
        </div>
      </div>
      <button type="button" (click)="clear()" class="text-xs text-text-muted hover:text-accent">清除</button>
    </div>
    <div class="flex gap-2">
      <button
        type="button"
        (click)="startFlashcard()"
        [class]="'flex-1 rounded-full border py-2 text-center text-xs font-bold transition ' + c.flashcardButtonClass"
      >
        卡牌複習
      </button>
      <button
        type="button"
        (click)="startQuiz()"
        [class]="'flex-1 rounded-full py-2 text-center text-xs font-bold text-white transition ' + c.quizButtonClass"
      >
        重新測驗
      </button>
    </div>
  </div>
}
