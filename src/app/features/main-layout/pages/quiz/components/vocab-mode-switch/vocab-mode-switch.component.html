<div class="grid grid-cols-3 gap-2 sm:flex sm:flex-row sm:gap-4 lg:gap-[22px]">
  <div class="flex flex-1 flex-col items-center gap-1.5 rounded-lg border border-accent bg-accent-soft px-2 py-2.5 sm:flex-row sm:gap-3.5 sm:px-5 sm:py-4">
    <span class="flex h-9 w-9 flex-none items-center justify-center rounded-md bg-white sm:h-10 sm:w-10">
      <i class="fa-solid fa-list text-accent"></i>
    </span>
    <span class="flex flex-col items-center gap-0.5 sm:items-start">
      <span class="font-heading text-sm font-bold sm:text-base text-accent sm:text-base">單詞總覽</span>
      <span class="hidden text-xs text-text-secondary sm:inline">瀏覽全部單字</span>
    </span>
  </div>
  <button
    type="button"
    (click)="store.startFlashcard()"
    class="flex flex-1 flex-col items-center gap-1.5 rounded-lg border border-border bg-surface px-2 py-2.5 text-left transition hover:border-accent/40 hover:bg-accent-soft/20 sm:flex-row sm:gap-3.5 sm:px-5 sm:py-4"
  >
    <span class="flex h-9 w-9 flex-none items-center justify-center rounded-md bg-bg sm:h-10 sm:w-10">
      <i class="fa-solid fa-layer-group text-text-secondary"></i>
    </span>
    <span class="flex flex-col items-center gap-0.5 sm:items-start">
      <span class="font-heading text-sm font-bold sm:text-base text-ink sm:text-base">卡牌背誦</span>
      <span class="hidden text-xs text-text-secondary sm:inline">發音・漢字・例句</span>
    </span>
  </button>
  <button
    type="button"
    (click)="quizSetupOpen.set(true)"
    class="flex flex-1 flex-col items-center gap-1.5 rounded-lg border border-border bg-surface px-2 py-2.5 text-left transition hover:border-accent/40 hover:bg-accent-soft/20 sm:flex-row sm:gap-3.5 sm:px-5 sm:py-4"
  >
    <span class="flex h-9 w-9 flex-none items-center justify-center rounded-md bg-bg sm:h-10 sm:w-10">
      <i class="fa-solid fa-circle-check text-text-secondary"></i>
    </span>
    <span class="flex flex-col items-center gap-0.5 sm:items-start">
      <span class="font-heading text-sm font-bold sm:text-base text-ink sm:text-base">單字測驗</span>
      <span class="hidden text-xs text-text-secondary sm:inline">四選一・錯題複習</span>
    </span>
  </button>
</div>

<!-- 單字測驗設定：點「單字測驗」才出現，選題型、題數後開始 -->
@if (quizSetupOpen()) {
  <div class="fixed inset-0 z-50 flex items-end justify-center bg-black/40 sm:items-center sm:p-6" (click)="quizSetupOpen.set(false)">
    <div
      class="flex max-h-[90vh] w-full max-w-md flex-col gap-4 overflow-y-auto rounded-t-2xl bg-surface p-5 sm:rounded-2xl"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start justify-between gap-3">
        <div class="flex flex-col">
          <p class="font-heading text-lg font-bold text-ink">單字測驗</p>
          <p class="text-xs text-text-muted">範圍：目前篩選出的 {{ store.filteredEntries().length }} 個單字</p>
        </div>
        <button type="button" (click)="quizSetupOpen.set(false)" aria-label="關閉" class="flex h-8 w-8 items-center justify-center rounded-full text-text-muted hover:bg-bg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="flex flex-col gap-2">
        <p class="text-sm font-bold text-ink">題型</p>
        @for (t of typeOptions; track t.value) {
          <button
            type="button"
            (click)="store.setQuizType(t.value)"
            [class]="
              'flex flex-col gap-0.5 rounded-lg border-2 px-3.5 py-2.5 text-left transition ' +
              (store.quizTypeSetting() === t.value ? 'border-accent bg-accent-soft' : 'border-border bg-surface')
            "
          >
            <span class="text-sm font-bold text-ink">{{ t.label }}</span>
            <span class="text-xs text-text-secondary">{{ t.hint }}</span>
          </button>
        }
      </div>

      <div class="flex flex-col gap-2">
        <p class="text-sm font-bold text-ink">題數</p>
        <div class="flex flex-wrap gap-2">
          @for (n of countOptions; track n) {
            <button
              type="button"
              (click)="store.setQuizCount(n)"
              [class]="
                'rounded-full px-4 py-1.5 text-sm font-bold transition ' +
                (store.quizCountSetting() === n ? 'bg-accent text-white' : 'border border-border bg-bg text-text-secondary')
              "
            >
              {{ n === 0 ? '全部' : n + ' 題' }}
            </button>
          }
        </div>
      </div>

      <button
        type="button"
        (click)="startQuiz()"
        [disabled]="store.filteredEntries().length === 0"
        class="rounded-full bg-accent py-3 text-[15px] font-bold text-white transition hover:brightness-105 disabled:opacity-40"
      >
        開始測驗
      </button>
    </div>
  </div>
}
