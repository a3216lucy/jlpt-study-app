@if (store.pageMode() === 'list') {
  <div class="flex flex-col gap-4 pb-8 sm:gap-5 lg:gap-6">
    <!-- Header -->
    <div class="flex items-center justify-between gap-3">
      <h1 class="font-heading text-xl font-bold text-ink sm:text-2xl lg:text-[26px]">單詞</h1>
      @if (!store.showCreatePlan()) {
        <button
          type="button"
          (click)="store.setShowCreatePlan(true)"
          class="flex items-center justify-center gap-1.5 rounded-full bg-accent px-4 py-2 text-sm font-bold text-white transition hover:brightness-105 active:scale-[0.98]"
        >
          <i class="fa-solid fa-plus text-xs"></i> 建立學習計畫
        </button>
      }
    </div>

    @if (store.loading()) {
      <div class="flex items-center justify-center py-20 text-text-muted">
        <i class="fa-solid fa-spinner fa-spin mr-2"></i> 載入中...
      </div>
    } @else {
      <app-vocab-plan-panel />
      <app-vocab-review-banner variant="wrong" />
      <app-vocab-review-banner variant="marked" />
      <app-vocab-mode-switch />
      <app-vocab-filters />
      <app-vocab-entry-list />
    }
  </div>
}

@if (store.pageMode() === 'flashcard') {
  <app-vocab-flashcard />
}

@if (store.pageMode() === 'quiz' && !store.quizShowResult()) {
  <app-vocab-quiz-question />
}

@if (store.pageMode() === 'quiz' && store.quizShowResult()) {
  <app-vocab-quiz-result />
}
