<main
  class="min-h-screen bg-[radial-gradient(circle_at_top,rgba(99,102,241,0.10),transparent_28%),linear-gradient(180deg,#f8fafc_0%,#eef4ff_100%)]"
>
  <div class="mx-auto flex min-h-screen max-w-7xl flex-col px-4 py-6 sm:px-6 lg:px-8">
    <header
      class="mb-6 rounded-[1.75rem] border border-slate-200/70 bg-white/90 p-4 shadow-[0_18px_40px_rgba(15,23,42,0.05)] backdrop-blur sm:p-5"
    >
      <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="mt-1 text-2xl font-bold text-slate-900">JLPT 備考練功房</h1>
          </div>
          <!-- 頭像（手機版顯示，桌機版隱藏） -->
          <a routerLink="/profile" class="sm:hidden">
            @if (auth.currentUser()?.photoURL) {
              <img
                [src]="auth.currentUser()!.photoURL!"
                alt="avatar"
                class="h-9 w-9 rounded-full ring-2 ring-slate-200"
              />
            } @else {
              <div
                class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-100 text-indigo-700 font-bold text-sm"
              >
                {{ auth.currentUser()?.displayName?.[0] ?? '?' }}
              </div>
            }
          </a>
        </div>

        <nav class="flex flex-wrap gap-2 items-center">
          <a
            #quizLink="routerLinkActive"
            routerLink="/"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLinkActive="active"
            [class]="
              'rounded-full border px-4 py-2 text-sm font-medium transition ' +
              (quizLink.isActive
                ? 'border-indigo-600 bg-indigo-600 text-white shadow-[0_10px_20px_rgba(79,70,229,0.18)]'
                : 'border-slate-200 bg-white text-slate-700 hover:border-indigo-300 hover:text-indigo-700')
            "
          >
            單字測驗
          </a>
          <a
            #largeQuizLink="routerLinkActive"
            routerLink="/large-quiz"
            routerLinkActive="active"
            [class]="
              'rounded-full border px-4 py-2 text-sm font-medium transition ' +
              (largeQuizLink.isActive
                ? 'border-amber-500 bg-amber-500 text-white shadow-[0_10px_20px_rgba(245,158,11,0.18)]'
                : 'border-slate-200 bg-white text-slate-700 hover:border-amber-300 hover:text-amber-700')
            "
          >
            句型測驗
          </a>
          <a
            #grammarReviewLink="routerLinkActive"
            routerLink="/grammar-review"
            routerLinkActive="active"
            [class]="
              'rounded-full border px-4 py-2 text-sm font-medium transition ' +
              (grammarReviewLink.isActive
                ? 'border-emerald-500 bg-emerald-500 text-white shadow-[0_10px_20px_rgba(16,185,129,0.18)]'
                : 'border-slate-200 bg-white text-slate-700 hover:border-emerald-300 hover:text-emerald-700')
            "
          >
            文法複習
          </a>
          <a
            #pastExamLink="routerLinkActive"
            routerLink="/past-exam"
            routerLinkActive="active"
            [class]="
              'rounded-full border px-4 py-2 text-sm font-medium transition ' +
              (pastExamLink.isActive
                ? 'border-violet-500 bg-violet-500 text-white shadow-[0_10px_20px_rgba(139,92,246,0.18)]'
                : 'border-slate-200 bg-white text-slate-700 hover:border-violet-300 hover:text-violet-700')
            "
          >
            考古題
          </a>
          <!-- 頭像（桌機版） -->
          <a routerLink="/profile" class="hidden sm:block ml-1">
            @if (auth.currentUser()?.photoURL) {
              <img
                [src]="auth.currentUser()!.photoURL!"
                alt="avatar"
                class="h-9 w-9 rounded-full ring-2 ring-slate-200 hover:ring-indigo-400 transition"
              />
            } @else {
              <div
                class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-100 text-indigo-700 font-bold text-sm hover:bg-indigo-200 transition"
              >
                {{ auth.currentUser()?.displayName?.[0] ?? '?' }}
              </div>
            }
          </a>
        </nav>
      </div>
    </header>

    <div class="flex-1">
      <router-outlet></router-outlet>
    </div>
  </div>
</main>
