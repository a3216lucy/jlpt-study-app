<div
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-linear-to-b from-sky-200 via-sky-100 to-white px-4"
>
  <!-- Card -->
  <div
    class="relative w-full max-w-sm rounded-3xl bg-white/85 px-8 py-10 shadow-2xl backdrop-blur-md ring-1 ring-white/60"
  >
    <!-- Icon -->
    <img src="/images/login-1.svg" alt="Login illustration" class="mx-auto mb-6 w-25 h-25" />

    <!-- Title -->
    <h1 class="text-center text-2xl font-black text-slate-900">JLPT 備考練功房</h1>

    <!-- Google button -->
    <button
      (click)="loginWithGoogle()"
      [disabled]="loading()"
      class="mt-8 flex w-full items-center justify-center gap-3 rounded-2xl bg-slate-800 px-4 py-3.5 text-sm font-semibold text-white shadow-lg transition-all hover:bg-slate-700 active:scale-[0.98] disabled:opacity-60"
    >
      @if (loading()) {
        <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          />
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
          />
        </svg>
        <span>登入中…</span>
      } @else {
        <svg class="h-5 w-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>使用 Google 繼續</span>
      }
    </button>

    @if (error()) {
      <p class="mt-4 text-center text-xs text-rose-500">{{ error() }}</p>
    }

    <p class="mt-6 text-center text-xs text-slate-400">登入即代表您同意本站，僅作個人學習用途</p>
  </div>
</div>
